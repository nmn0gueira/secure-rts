# remote: the endpoint from which the proxy receives the stream
# localdelivery: comma-separated list of endpoints to forward the stream to (VLC: udp://@localhost:7777, MPV: udp://localhost:7777)
remote:localhost:8888
localdelivery:localhost:7777

shp.keystore:local/shp-stores/client-keystore.p12
shp.truststore:local/shp-stores/client-truststore.p12
shp.password:changeit

pq.keystore:local/pq-shp-stores/client-keystore.p12
pq.truststore:local/pq-shp-stores/client-truststore.p12
pq.password:changeit
