# RTSSP cryptographic configuration
#
# CONFIDENTIALITY: JCE cipher transformation string, or DPRG for the custom AES-CTR keystream cipher
# SYMMETRIC_KEY:   hex-encoded key (16 bytes = AES-128, 32 bytes = AES-256)
# IV:              hex-encoded IV (only for non-AEAD block ciphers; omit for GCM / ChaCha20-Poly1305 / DPRG)
# INTEGRITY:       NULL (AEAD handles it), MAC (HMAC/GMAC appended outside), H (hash inside encryption)
# MAC:             MAC algorithm name (required when INTEGRITY is MAC)
# MAC_KEY:         hex-encoded MAC key (required when INTEGRITY is MAC)
# H:               hash algorithm name (required when INTEGRITY is H)
#
CONFIDENTIALITY:AES/GCM/NoPadding
SYMMETRIC_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
INTEGRITY:NULL
